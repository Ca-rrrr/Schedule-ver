<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>일정간단 ver</title>

  <!-- GAS 연결 예열 -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">

  <!-- 캐시 무효화: v 숫자 ↑ -->
  <link rel="stylesheet" href="css/style.css?v=12" />
  <script defer src="js/app.js?v=12"></script>
</head>
<body>
  <header class="topbar">
    <div class="nav">
      <select id="ymSelect"></select>
      <button id="prevBtn">◀</button>
      <div id="monthLabel"></div>
      <button id="nextBtn">▶</button>
    </div>

    <div class="controls">
      <select id="memberSelect"></select>
      <button id="manageBtn">멤버관리</button>
      <button id="reloadBtn">새로고침</button>
      <button id="confirmModeBtn" title="확정 모드 토글">확정모드</button>
    </div>

    <!-- 미니 달력 -->
    <div id="miniCal" class="mini-cal"></div>
  </header>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <footer class="footer">© 2025 AR C — All rights reserved.</footer>

  <!-- 날짜 상세 모달 -->
  <dialog id="dayDlg" class="dlg">
    <h3 id="dayTitle"></h3>
  
    <label class="line">
      <input type="checkbox" id="chkUnavail" />
      <span>이 날짜 불가</span>
    </label>
  
    <!-- ▼ 새로 추가: 전역 확정 체크 -->
    <label class="line">
      <input type="checkbox" id="chkConfirmed" />
      <span>이 날짜 확정</span>
    </label>
  
    <label class="line block">
      <span>메모</span>
      <textarea id="noteBox" rows="5" placeholder="부분 가능/사유 등"></textarea>
    </label>
  
    <details id="othersWrap" class="others">
      <summary>다른 멤버 메모</summary>
      <div id="othersList" class="others-list"></div>
    </details>
  
    <div class="right">
      <button id="btnSaveNote">저장</button>
      <button id="btnCloseDay">닫기</button>
    </div>
  </dialog>
  <!-- 멤버 관리 모달 -->
  <dialog id="memDlg" class="dlg">
    <h3>멤버 관리</h3>

    <div class="row add">
      <select id="newEmoji"></select>
      <input id="newName" placeholder="새 이름" />
      <button id="btnAddMem">추가</button>
    </div>

    <div id="memList" class="mem-list"></div>

    <div class="right">
      <button id="btnCloseMem">닫기</button>
    </div>
  </dialog>
</body>
</html>
